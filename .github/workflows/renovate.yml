name: Renovate

on:
  schedule:
    - cron: '17 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: github.repository == 'i-prikot/tiptap'
    name: Dependency updates
    runs-on: ubuntu-latest

    steps:
      - name: 'INFO: Checkout Renovate configuration'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: 'INFO: Create Renovate GitHub App token'
        id: renovate-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: 'INFO: Run self-hosted Renovate'
        uses: renovatebot/github-action@1a96852b0384df1837619d04c60b2d10d1f9ff08 # v46.1.21
        with:
          configurationFile: scripts/renovate-workflow-config.json
          token: ${{ steps.renovate-app-token.outputs.token }}
        env:
          LOG_LEVEL: info
