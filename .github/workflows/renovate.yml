name: Renovate

on:
  schedule:
    - cron: '17 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: github.repository == 'i-prikot/tiptap'
    name: Dependency updates
    runs-on: ubuntu-latest

    steps:
      - name: 'INFO: Checkout Renovate configuration'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: 'INFO: Run self-hosted Renovate'
        uses: renovatebot/github-action@1a96852b0384df1837619d04c60b2d10d1f9ff08 # v46.1.21
        with:
          configurationFile: scripts/renovate-workflow-config.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: info
